<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErgonometApp - Iniciar sesión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", Arial, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg,#eef3fb,#dbe5f4); color:#263238; }
        .login-shell { width: min(430px,100%); }
        .brand { text-align:center; margin-bottom:22px; }
        .logo { width:78px; height:78px; margin:0 auto 14px; border-radius:24px; display:grid; place-items:center; color:#fff; font-size:30px; font-weight:800; background:linear-gradient(135deg,#667eea,#764ba2); box-shadow:0 12px 30px rgba(86,91,184,.28); }
        .brand h1 { font-size:27px; }
        .brand p { margin-top:5px; color:#64748b; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
        .card { background:#fff; border:1px solid #e2e8f0; border-radius:18px; padding:30px; box-shadow:0 18px 50px rgba(15,23,42,.10); }
        .card h2 { font-size:20px; margin-bottom:6px; }
        .intro { color:#64748b; font-size:14px; margin-bottom:24px; }
        .field { margin-bottom:18px; }
        label { display:block; font-weight:650; font-size:14px; margin-bottom:7px; }
        input { width:100%; border:1px solid #cbd5e1; border-radius:10px; padding:12px 13px; font-size:15px; outline:none; }
        input:focus { border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,.13); }
        .password-wrap { position:relative; }
        .password-wrap input { padding-right:76px; }
        .toggle { position:absolute; right:9px; top:8px; border:0; background:#eef2ff; color:#4f46e5; border-radius:7px; padding:6px 9px; cursor:pointer; font-size:12px; }
        .submit { width:100%; margin-top:7px; border:0; border-radius:10px; padding:13px; color:#fff; font-size:15px; font-weight:750; cursor:pointer; background:linear-gradient(135deg,#667eea,#764ba2); }
        .error { margin-bottom:18px; padding:11px 13px; border-radius:9px; background:#fff1f2; border:1px solid #fecdd3; color:#be123c; font-size:14px; }
        .footer { text-align:center; color:#94a3b8; font-size:12px; margin-top:18px; }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="brand">
            <div class="logo">EA</div>
            <h1>ErgonometApp</h1>
            <p>Evaluación ergonómica profesional</p>
        </div>
        <section class="card">
            <h2>Iniciar sesión</h2>
            <p class="intro">Accede al panel de métodos y evaluaciones ergonómicas.</p>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="POST" action="/login">
                <div class="field">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" autocomplete="username" placeholder="Ingresa tu usuario" required autofocus>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
                        <button class="toggle" type="button" onclick="togglePassword()">Mostrar</button>
                    </div>
                </div>
                <button class="submit" type="submit">Entrar a ErgonometApp</button>
            </form>
        </section>
        <p class="footer">ErgonometApp · Suite de herramientas de evaluación ergonómica</p>
    </main>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const button = document.querySelector('.toggle');
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            button.textContent = showing ? 'Mostrar' : 'Ocultar';
        }
    </script>
</body>
</html>
