<style>
/* V8 · Captura técnica por factor y eliminación de encabezado repetitivo */
.grid > section.panel > .head{display:none!important}
.factor-evidence{margin-top:14px;padding-top:12px;border-top:1px dashed #dfe5db}
.factor-evidence-title{font-size:11px;font-weight:850;color:#536d25;margin-bottom:8px}
.factor-evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.factor-evidence label{font-size:10px;color:#677069;display:block;margin-bottom:5px;font-weight:700}
.factor-evidence textarea{width:100%;min-height:92px;resize:vertical;border:1px solid #dfe5db;border-radius:9px;padding:9px;font:12px Inter,Segoe UI,Arial;background:#fff}
.factor-evidence input[type=file]{width:100%;border:1px solid #dfe5db;border-radius:9px;padding:9px;background:#fff;font-size:11px}
.factor-evidence-note{font-size:9px;color:#7a837d;line-height:1.4;margin-top:5px}
.factor-photo-preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.factor-photo-preview img{width:100%;height:105px;object-fit:contain;border:1px solid #e1e6df;border-radius:8px;background:#f5f7f4}
@media(max-width:760px){.factor-evidence-grid{grid-template-columns:1fr}}
</style>
<script>
(function(){
 const qsa=(s,r=document)=>Array.from(r.querySelectorAll(s));
 const safeKey=t=>(t||'factor').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,70);
 function limitTwo(input,preview){
   input.addEventListener('change',()=>{
     let files=Array.from(input.files||[]).filter(f=>f.type.startsWith('image/'));
     if(files.length>2){
       try{const dt=new DataTransfer();files.slice(0,2).forEach(f=>dt.items.add(f));input.files=dt.files;files=files.slice(0,2)}catch(_){files=files.slice(0,2)}
       alert('Puedes conservar un máximo de 2 fotografías de evidencia por factor.');
     }
     if(preview){preview.innerHTML='';files.slice(0,2).forEach(file=>{const img=document.createElement('img');img.alt=file.name;img.src=URL.createObjectURL(file);preview.appendChild(img)})}
   });
 }
 function enhanceFactor(factor,sectionId,index){
   const choice=factor.querySelector('.choices[data-factor]');
   const factorKey=(choice&&choice.dataset.factor)||`${sectionId}_factor_${index+1}`;
   const key=safeKey(factorKey);
   const h=factor.querySelector('h3'); const title=h?h.textContent.trim():`Factor ${index+1}`;
   let wrap=factor.querySelector('.factor-evidence');
   if(!wrap){
     wrap=document.createElement('div');wrap.className='factor-evidence';
     wrap.innerHTML=`<div class="factor-evidence-title">Evidencia, justificación y conclusión del criterio seleccionado</div><div class="factor-evidence-grid"><div><label>Justificación de la selección</label><textarea name="justificacion_${key}" aria-label="Justificación · ${title}" placeholder="Describe por qué la condición observada corresponde a la opción seleccionada."></textarea><div class="factor-evidence-note">Explica el criterio técnico observado que sustenta la puntuación.</div></div><div><label>Conclusión del inciso</label><textarea name="conclusion_${key}" aria-label="Conclusión · ${title}" placeholder="Redacta la conclusión específica de este factor y, cuando aplique, la necesidad de control o seguimiento."></textarea><div class="factor-evidence-note">Esta conclusión se conservará para la matriz imprimible.</div></div><div style="grid-column:1/-1"><label>Fotografías de evidencia (máximo 2)</label><input name="evidencia_${key}" type="file" accept="image/*" multiple aria-label="Fotografías · ${title}"><div class="factor-evidence-note">Adjunta hasta dos fotografías asociadas específicamente a este factor.</div><div class="factor-photo-preview"></div></div></div>`;
     factor.appendChild(wrap);
   }else{
     const grid=wrap.querySelector('.factor-evidence-grid')||wrap;
     if(!wrap.querySelector(`[name="conclusion_${key}"]`)){
       const block=document.createElement('div');block.className='factor-conclusion';block.innerHTML=`<label>Conclusión del inciso</label><textarea name="conclusion_${key}" aria-label="Conclusión · ${title}" placeholder="Redacta la conclusión específica de este factor y, cuando aplique, la necesidad de control o seguimiento."></textarea><div class="factor-evidence-note">Esta conclusión se conservará para la matriz imprimible.</div>`;
       const photoBlock=grid.querySelector('input[type=file]')?.parentElement;
       if(photoBlock)grid.insertBefore(block,photoBlock);else grid.appendChild(block);
     }
     const ttl=wrap.querySelector('.factor-evidence-title');if(ttl)ttl.textContent='Evidencia, justificación y conclusión del criterio seleccionado';
     const inp=wrap.querySelector('input[type=file]');if(inp){const lab=inp.parentElement?.querySelector('label');if(lab)lab.textContent='Fotografías de evidencia (máximo 2)';const note=inp.parentElement?.querySelector('.factor-evidence-note');if(note)note.textContent='Adjunta hasta dos fotografías asociadas específicamente a este factor.'}
   }
   const input=wrap.querySelector('input[type=file]');const preview=wrap.querySelector('.factor-photo-preview');if(input&&!input.dataset.max2){input.dataset.max2='1';limitTwo(input,preview)}
 }
 ['ai2','ai3','ai4'].forEach(id=>{const sec=document.getElementById(id);if(sec)qsa('.factor',sec).forEach((f,i)=>enhanceFactor(f,id,i))});
})();
</script>
