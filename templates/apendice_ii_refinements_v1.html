<style>
.aii-guide{background:#fff;border:1px solid #e3e8df;border-radius:16px;margin-top:22px;overflow:hidden}.aii-guide-head{padding:17px 19px;border-bottom:1px solid #e3e8df}.aii-guide-head h2{font:500 21px Georgia;margin:0}.aii-guide-body{padding:18px}.aii-guide-intro{font-size:11px;line-height:1.65;color:#56605a;margin:0 0 14px}.aii-mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.aii-mode-card{border:1px solid #dfe5db;border-radius:11px;padding:14px;background:#fafbf9;cursor:pointer;text-align:left}.aii-mode-card.active{border:2px solid #536d25;background:#f1f5ea}.aii-mode-card b{display:block;color:#536d25;font-size:13px;margin-bottom:5px}.aii-mode-card span{font-size:10px;color:#68716b;line-height:1.5}.aii-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.aii-tab{border:1px solid #dfe5db;border-radius:9px;background:#fff;padding:9px 13px;font-weight:800;font-size:11px}.aii-tab.active{background:#f1f5ea;border-color:#536d25;color:#536d25}.factor .norm-help{margin:8px 0 11px;padding:10px 11px;background:#f7faf3;border-left:4px solid #536d25;border-radius:8px;font-size:10px;line-height:1.55;color:#58625c}.norm-table{width:100%;border-collapse:collapse;margin:8px 0 10px;font-size:10px}.norm-table th,.norm-table td{border:1px solid #dfe5db;padding:6px}.norm-table th{background:#eef5e8}.norm-visual{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.norm-visual div{border:1px solid #dfe5db;border-radius:8px;padding:9px;text-align:center;font-size:10px;background:#fff}.norm-visual b{display:block;margin-bottom:4px;color:#536d25}.factor-evidence{margin-top:14px;padding-top:12px;border-top:1px dashed #dfe5db}.factor-evidence-title{font-size:11px;font-weight:850;color:#536d25;margin-bottom:8px}.factor-evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.factor-evidence label{font-size:10px;color:#677069;display:block;margin-bottom:5px;font-weight:700}.factor-evidence textarea{width:100%;min-height:82px;resize:vertical;border:1px solid #dfe5db;border-radius:9px;padding:9px;font:12px Inter,Segoe UI,Arial;background:#fff}.factor-evidence input[type=file]{width:100%;border:1px solid #dfe5db;border-radius:9px;padding:9px;background:#fff;font-size:11px}.factor-evidence-note{font-size:9px;color:#7a837d;line-height:1.4;margin-top:5px}.factor-photo-preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}.factor-photo-preview img{width:100%;height:105px;object-fit:contain;border:1px solid #e1e6df;border-radius:8px;background:#f5f7f4}.aii-breakdown{margin-top:16px;border-top:1px solid #e3e8df;padding-top:14px}.aii-breakdown h3{font-size:12px;color:#536d25;margin:0 0 9px}.aii-table-wrap{overflow:auto;border:1px solid #e3e8df;border-radius:10px}.aii-table{width:100%;border-collapse:collapse;min-width:520px;font-size:10px}.aii-table th,.aii-table td{padding:8px 9px;border-bottom:1px solid #e7ebe4;text-align:left}.aii-table th{background:#f7f9f5;color:#68716b;text-transform:uppercase;font-size:9px}.aii-color{font-weight:900;text-align:center!important}.aii-green{background:#00ff00!important;color:#000!important}.aii-yellow{background:#ffff00!important;color:#000!important}.aii-red{background:#ff0000!important;color:#fff!important}.aii-magenta{background:#ff00ff!important;color:#fff!important}.aii-auto-badge{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900}.aii-capacity{font-weight:800;color:#8c3229}.aii-actions{margin-top:16px}.aii-actions h3{font-size:12px;color:#536d25}.aii-actions table{width:100%;border-collapse:collapse;font-size:9px}.aii-actions td,.aii-actions th{border:1px solid #dfe5db;padding:6px}.aii-actions th{background:#f7f9f5}.factor-conclusion{grid-column:1/-1}@media(max-width:700px){.aii-mode-cards,.factor-evidence-grid,.norm-visual{grid-template-columns:1fr}}
</style>
<script>
(function(){
 const qsa=(s,r=document)=>Array.from(r.querySelectorAll(s));
 const safeKey=t=>(t||'factor').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,70);
 const grid=document.querySelector('main.wrap > .grid');
 if(grid&&!document.querySelector('.aii-guide'))grid.insertAdjacentHTML('beforebegin',`<section class="aii-guide"><div class="aii-guide-head"><h2>AII.1 Antes de comenzar la evaluación</h2></div><div class="aii-guide-body"><p class="aii-guide-intro">Observa la actividad durante el tiempo necesario para que sea representativa; involucra a trabajadores, supervisores o responsables de seguridad y salud; selecciona la evaluación adecuada y evalúa cada actividad por separado. Las bandas de color permiten identificar los factores que requieren mayor atención.</p><div class="aii-mode-cards"><button type="button" class="aii-mode-card active" data-mode="sin"><b>AII.3 · Sin equipo auxiliar</b><span>Empuje o arrastre manual: rodando, girando sobre su base o arrastrando/jalando/deslizando.</span></button><button type="button" class="aii-mode-card" data-mode="con"><b>AII.5 · Con equipo auxiliar</b><span>Empuje o jalado mediante equipo pequeño, mediano o grande. Incluye verificación de capacidad nominal.</span></button></div></div></section>`);
 const body=document.querySelector('main.wrap .grid section.panel .body');
 if(body&&!body.querySelector('.aii-tabs'))body.insertAdjacentHTML('afterbegin','<div class="aii-tabs"><button type="button" class="aii-tab active" data-mode="sin">AII.3 Sin equipo auxiliar</button><button type="button" class="aii-tab" data-mode="con">AII.5 Con equipo auxiliar</button></div>');
 const modo=document.getElementById('modo'); if(modo&&modo.parentElement) modo.parentElement.style.display='none';
 function setMode(m){if(!modo)return;modo.value=m;window.renderMode&&window.renderMode();qsa('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));document.querySelector('.factor h3').textContent=m==='sin'?'AII.3 a) Actividad y peso de la carga (kg)':'AII.5 a) Tipo de equipo auxiliar y peso de la carga (kg)';refreshNorm();}
 qsa('.aii-mode-card,.aii-tab').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
 const helps={
 '2. Postura':'Observar la posición general de las manos y del cuerpo. Buena: torso mayormente vertical, sin torsión y manos entre cadera y hombro (0). Razonable: cuerpo inclinado en dirección del esfuerzo, torso flexionado/torcido o manos bajo la cadera (3). Pobre o deficiente: inclinación severa, cuclillas/arrodillado, empuje con espalda, torsión severa o manos detrás/lateral/por encima del hombro (6).',
 '3. Acoplamiento mano-carga':'Bueno: manijas o asas que permiten agarre cómodo/completo (0). Razonable: zonas de agarre parcial, dedos a 90° o contacto parcial (1). Pobre o deficiente: sin asas o contacto incómodo (2).',
 '4. Patrón de trabajo':'Evalúa repetición, pausas y recuperación conforme al patrón observado durante la tarea.',
 '5. Distancia por viaje':'Registra la distancia real recorrida en cada viaje y selecciona la condición normativa aplicable.',
 '6. Condición del equipo auxiliar':'Para AII.5 revisa ruedas/rodajas, frenos, dirección, mantenimiento y cualquier condición que incremente la fuerza o reduzca el control.',
 'Superficie de trabajo':'Valora la condición de la superficie por la que se desplaza la carga o el equipo.',
 'Obstáculos':'Identifica escalones, rampas, desniveles, puertas, espacios estrechos u obstáculos en la ruta.',
 'Otros factores':'Registra los demás factores presentes que incrementen la exigencia o dificulten la operación.'};
 qsa('.factor').forEach((factor,index)=>{const h=factor.querySelector('h3');if(!h)return;const title=h.textContent.trim();if(helps[title]&&!factor.querySelector('.norm-help'))h.insertAdjacentHTML('afterend',`<div class="norm-help"><b>Guía de evaluación:</b> ${helps[title]}</div>`);if(factor.querySelector('.factor-evidence'))return;const choices=factor.querySelector('.choices[data-factor]');const key=safeKey((choices&&choices.dataset.factor)||title||('factor_'+index));const wrap=document.createElement('div');wrap.className='factor-evidence';wrap.innerHTML=`<div class="factor-evidence-title">Evidencia, justificación y conclusión del criterio seleccionado</div><div class="factor-evidence-grid"><div><label>Justificación de la selección</label><textarea name="justificacion_${key}" placeholder="Describe qué observaste y por qué corresponde a la condición seleccionada."></textarea></div><div><label>Conclusión del inciso</label><textarea name="conclusion_${key}" placeholder="Redacta la conclusión específica de este factor."></textarea></div><div style="grid-column:1/-1"><label>Fotografías de evidencia (máximo 2)</label><input name="evidencia_${key}" type="file" accept="image/*" multiple><div class="factor-evidence-note">Adjunta hasta dos fotografías asociadas al factor.</div><div class="factor-photo-preview"></div></div></div>`;factor.appendChild(wrap);const input=wrap.querySelector('input[type=file]'),prev=wrap.querySelector('.factor-photo-preview');input.addEventListener('change',()=>{let fs=Array.from(input.files||[]).filter(f=>f.type.startsWith('image/'));if(fs.length>2){try{const dt=new DataTransfer();fs.slice(0,2).forEach(f=>dt.items.add(f));input.files=dt.files;fs=fs.slice(0,2)}catch(_){fs=fs.slice(0,2)}}prev.innerHTML='';fs.forEach(f=>{const im=document.createElement('img');im.src=URL.createObjectURL(f);prev.appendChild(im)})})});
 const first=document.querySelector('.factor');
 function refreshNorm(){if(!first)return;first.querySelector('.norm-help')?.remove();const con=modo&&modo.value==='con';const html=con?`<div class="norm-help"><b>AII.5 a) Tipo de equipo auxiliar y peso:</b> calcula la masa total movida incluyendo equipo y carga. Si excede la capacidad nominal del fabricante, la actividad es <b>Inaceptable</b> y no debe realizarse hasta corregirla.<table class="norm-table"><tr><th>Equipo</th><th>Bajo 0</th><th>Medio 2</th><th>Alto 4</th><th>Muy alto 8</th></tr><tr><td>Pequeño · 1–2 ruedas</td><td>&lt;50 kg</td><td>50–100</td><td>100–200</td><td>&gt;200</td></tr><tr><td>Mediano · 3+ ruedas</td><td>&lt;250</td><td>250–500</td><td>500–750</td><td>&gt;750</td></tr><tr><td>Grande / dirigible / rieles</td><td>&lt;600</td><td>600–1000</td><td>1000–1500</td><td>&gt;1500</td></tr></table><div class="norm-visual"><div><b>Pequeño</b>Carretilla, contenedor con ruedas o diablo.</div><div><b>Mediano</b>Jaula o contenedor con tres o más ruedas.</div><div><b>Grande</b>Patín, equipo dirigible o sistema sobre rieles.</div></div></div>`:`<div class="norm-help"><b>AII.3 a) Actividad y peso:</b> identifica la actividad y evalúa la masa total movida. Si se realizan dos o más tipos, deben evaluarse por separado.<table class="norm-table"><tr><th>Actividad</th><th>Bajo 0</th><th>Medio 2</th><th>Alto 4</th><th>Muy alto 8</th></tr><tr><td>Rodando</td><td>&lt;400 kg</td><td>400–600</td><td>600–1000</td><td>&gt;1000</td></tr><tr><td>Girando sobre su base</td><td>&lt;80</td><td>80–120</td><td>120–150</td><td>&gt;150</td></tr><tr><td>Arrastrar/jalar/deslizar</td><td>&lt;25</td><td>25–50</td><td>50–80</td><td>&gt;80</td></tr></table><div class="norm-visual"><div><b>Rodando</b>Desplazamiento haciendo rodar la carga.</div><div><b>Girando sobre su base</b>La carga avanza girando/rodando sobre los bordes de su base.</div><div><b>Arrastrar / jalar / deslizar</b>Desplazamiento manual por tracción o deslizamiento.</div></div></div>`;first.querySelector('h3').insertAdjacentHTML('afterend',html)}
 function colorFor(v){v=Number(v)||0;if(v===0)return['Verde','aii-green'];if(v<=2)return['Amarillo','aii-yellow'];if(v<=6)return['Rojo','aii-red'];return['Magenta','aii-magenta']}
 const aside=document.querySelector('.scorebox .body');if(aside&&!document.getElementById('aiiBreakdown'))aside.insertAdjacentHTML('beforeend',`<div class="aii-breakdown" id="aiiBreakdown"><h3>Registro de color y valor por factor</h3><div class="aii-table-wrap"><table class="aii-table"><thead><tr><th>Factor</th><th>Color</th><th>Valor</th></tr></thead><tbody id="aiiBreakdownBody"></tbody></table></div><div class="aii-actions"><h3>Acciones conforme al nivel de riesgo</h3><table><tr><th>Nivel</th><th>Acción</th></tr><tr><td class="aii-green">Bajo – Aceptable</td><td>Seguimiento a grupos vulnerables.</td></tr><tr><td class="aii-yellow">Medio – Posible</td><td>Examinar la tarea con mayor detalle o implantar medidas mediante Programa de ergonomía.</td></tr><tr><td class="aii-red">Alto – Significativo</td><td>Acción rápida y medidas de control mediante Programa de ergonomía.</td></tr><tr><td class="aii-magenta">Muy Alto – Inaceptable</td><td>Detener actividades e implementar medidas de control.</td></tr></table></div></div>`);
 function renderBreakdown(){const out=document.getElementById('aiiBreakdownBody');if(!out||typeof vals==='undefined')return;const labels={weight:'Actividad/tipo de equipo y peso',postura:'Postura',agarre:'Acoplamiento mano-carga',patron:'Patrón de trabajo',distancia:'Distancia por viaje',equipoCond:'Condición del equipo auxiliar',superficie:'Superficie de trabajo',obstaculos:'Obstáculos',otros:'Otros factores'};out.innerHTML='';Object.keys(labels).forEach(k=>{if(k==='equipoCond'&&modo.value!=='con')return;const v=Object.prototype.hasOwnProperty.call(vals,k)?vals[k]:null;if(v===null)return;const c=colorFor(v);out.insertAdjacentHTML('beforeend',`<tr><td>${labels[k]}</td><td class="aii-color ${c[1]}">${c[0]}</td><td>${v}</td></tr>`)});const card=document.getElementById('weightCard');if(card){const c=colorFor(vals.weight||0);card.innerHTML=`Valor automático: <b>${vals.weight||0}</b> <span class="aii-auto-badge ${c[1]}">${c[0]}</span>`}}
 const oldCalc=window.calc;if(typeof oldCalc==='function')window.calc=function(){oldCalc();renderBreakdown()};const oldCW=window.calcWeight;if(typeof oldCW==='function')window.calcWeight=function(){oldCW();renderBreakdown()};document.addEventListener('click',e=>{if(e.target.closest('.choice'))setTimeout(renderBreakdown,0)});refreshNorm();setMode('sin');setTimeout(renderBreakdown,0);
})();
</script>
